<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Conexión - Proyecto Cursos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        #confirmar-eliminacion-dialog {
            border: 1px solid #adb5bd;
            border-radius: 6px;
            max-width: 480px;
            width: calc(100% - 2rem);
        }
        #confirmar-eliminacion-dialog::backdrop { background: rgb(0 0 0 / 55%); }
    </style>
</head>
<body class="bg-beige">
    <div class="container">
        <header class="header-seccion">
            <h1 class="mb-1">Panel de Pruebas del Backend</h1>
            <p class="text-muted mb-0">Verifica la conectividad del servidor</p>
            <div class="barra-botones">
                <a href="/cursos" class="btn btn-secundario">Volver a cursos</a>
            </div>
        </header>

        <main>
            <div class="tarjeta-contenido">
                <p class="mb-4">Haz clic en el botón para comprobar si la API responde:</p>
                <button onclick="probarConexion()" class="btn btn-primario">Probar Conexión con el Servidor</button>
                <div id="resultado" class="mt-4" role="status" aria-live="polite"></div>
            </div>
        </main>
    </div>

    <script>
        async function probarConexion() {
            const resultadoDiv = document.getElementById('resultado');
            resultadoDiv.style.color = '#333';
            resultadoDiv.innerText = 'Conectando con el servidor...';

            try {
                const respuesta = await fetch('http://localhost:3000/'); 
                
                if (respuesta.ok) {
                    const mensaje = await respuesta.text();
                    resultadoDiv.style.color = 'green';
                    resultadoDiv.innerText = '¡Conexión exitosa! Respuesta del servidor: ' + mensaje;
                } else {
                    resultadoDiv.style.color = 'orange';
                    resultadoDiv.innerText = 'El servidor respondió, pero con un código de error: ' + respuesta.status;
                }
            } catch (error) {
                resultadoDiv.style.color = 'red';
                resultadoDiv.innerText = 'Error: No se pudo conectar con el servidor (¿está encendido en el puerto 3000?).';
                console.error(error);
            }
        }
    </script>
</body>
</html>
