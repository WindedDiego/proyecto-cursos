<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Conexión - Proyecto Cursos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            padding-top: 50px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            display: inline-block;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #resultado {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Panel de Pruebas del Backend</h1>
        <p>Haz clic en el botón para comprobar si la API responde:</p>
        <button onclick="probarConexion()">Probar Conexión con el Servidor</button>
        <div id="resultado"></div>
    </div>

    <script>
        async function probarConexion() {
            const resultadoDiv = document.getElementById('resultado');
            resultadoDiv.style.color = '#333';
            resultadoDiv.innerText = 'Conectando con el servidor...';

            try {
                // Cambia esta URL si tu ruta raíz del backend responde a otra cosa (ej. http://localhost:3000/api)
                const respuesta = await fetch('http://localhost:3000/'); 
                
                if (respuesta.ok) {
                    const mensaje = await respuesta.text();
                    resultadoDiv.style.color = 'green';
                    resultadoDiv.innerText = '¡Conexión exitosa! Respuesta del servidor: ' + mensaje;
                } else {
                    resultadoDiv.style.color = 'orange';
                    resultadoDiv.innerText = 'El servidor respondió, pero con un código de error: ' + respuesta.status;
                }
            } catch (error) {
                resultadoDiv.style.color = 'red';
                resultadoDiv.innerText = 'Error: No se pudo conectar con el servidor (¿está encendido en el puerto 3000?).';
                console.error(error);
            }
        }
    </script>

</body>
</html>
